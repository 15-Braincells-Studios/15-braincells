<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Feed</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8ee;--mut:#8b93a7;--acc:#6ea8fe;--ok:#4ade80;--bad:#f87171;--pur:#c084fc}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--fg:#1b1f2a;--mut:#667085}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0}.mut{color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 20px 24px}
@media(max-width:800px){main{grid-template-columns:1fr}}
section h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.item{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.item.new{animation:flash 2s}@keyframes flash{from{outline:2px solid var(--acc)}to{outline:2px solid transparent}}
img{width:32px;height:32px;border-radius:50%;background:var(--mut)}
a{color:inherit;text-decoration:none}a:hover .t{text-decoration:underline}
.t{font-weight:600}.tag{font-size:12px;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--mut)}
.open{color:var(--ok)}.merged{color:var(--pur)}.closed{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px}.dot.ok{background:var(--ok)}
</style></head><body>
<header><h1 id="repo">GitHub Feed</h1><div class="mut"><span id="dot" class="dot"></span><span id="st">laden…</span></div></header>
<main><section><h2>Pushes</h2><div id="pushes"></div></section><section><h2>Pull requests</h2><div id="pulls"></div></section></main>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=d=>{const s=(Date.now()-new Date(d))/1000;return s<60?"zojuist":s<3600?Math.floor(s/60)+" min geleden":s<86400?Math.floor(s/3600)+" u geleden":Math.floor(s/86400)+" d geleden"};
const seen=new Set();let first=true;
async function load(){
  try{
    const d=await (await fetch("/api/feed")).json();
    repo.textContent=d.repo;
    dot.className="dot"+(d.status.ok?" ok":"");
    st.textContent=d.status.ok?"live · bijgewerkt "+ago(d.status.updated):"fout: "+d.status.error;
    pushes.innerHTML=d.pushes.map(p=>{const k="p"+p.sha+p.branch;const n=!first&&!seen.has(k);seen.add(k);
      return `<a href="${p.url}" target="_blank"><div class="item${n?" new":""}"><img src="${p.avatar||""}" alt=""><div><div class="t">${esc(p.message)}</div><div class="mut">${esc(p.author)} · <span class="tag">${esc(p.branch)}</span> · ${p.sha} · ${ago(p.date)}</div></div></div></a>`}).join("")||'<div class="mut">Niets gevonden</div>';
    pulls.innerHTML=d.pulls.map(p=>{const k="r"+p.number+p.updated;const n=!first&&!seen.has(k);seen.add(k);
      return `<a href="${p.url}" target="_blank"><div class="item${n?" new":""}"><img src="${p.avatar}" alt=""><div><div class="t">#${p.number} ${esc(p.title)}</div><div class="mut">${esc(p.author)} · <span class="${p.state}">${p.state}</span> · ${esc(p.branch)} · ${ago(p.updated)}</div></div></div></a>`}).join("")||'<div class="mut">Geen PRs</div>';
    first=false;
  }catch(e){st.textContent="server niet bereikbaar";dot.className="dot"}
}
load();setInterval(load,15000);
</script></body></html>
